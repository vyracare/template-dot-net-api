name: PR TO DEVELOP

on:
  push:
    branches:
      - 'feat/*'
      - 'fix/*'
      - 'feature/*'

jobs:
  ci-dot-net:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.404
      - name: Gerar projeto de validacao
        run: bash rename-dotnet-project.sh vyracare-api-validacao vyracare_test registros
      - name: Testar projeto gerado
        run: dotnet test Vyracare.Api.Validacao.Tests/Vyracare.Api.Validacao.Tests.csproj --configuration Release
      - name: Publicar artefato de validacao
        run: dotnet publish Vyracare.Api.Validacao.csproj --configuration Release --output ./publish

  open-pr-develop:
    runs-on: ubuntu-latest
    needs: ci-dot-net
    if: startsWith(github.ref, 'refs/heads/feat/') || startsWith(github.ref, 'refs/heads/fix/') || startsWith(github.ref, 'refs/heads/feature/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.PAT_TOKEN }}

      - name: Open Pull Request to develop
        uses: repo-sync/pull-request@v2
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          source_branch: ${{ github.ref_name }}
          destination_branch: develop
          pr_title: "PR automatic ${{ github.ref_name }} into develop"
          pr_body: |
            PR automatica criada pelo pipeline.
            Branch de origem: `${{ github.ref_name }}`
